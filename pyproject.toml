[project]
name = "skincheckmvp"
version = "0.1.0"
description = "Skin lesion classification app"
authors = [{ name = "samuelpilot86", email = "samuel.pilot@mines-paris.org" }]
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.38.0",
    "tensorflow>=2.17.0",
    "numpy>=1.26.4",
    "pillow>=10.4.0"
]

[tool.poetry]
package-mode = false  # Désactive le mode package pour éviter l'installation du projet

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
