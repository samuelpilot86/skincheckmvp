name: Generate Lockfile

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permet de lancer manuellement

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13' # Compatible avec tes logs
      - name: Install uv
        run: pip install uv
      - name: Debug uv version and help
        run: |
          uv --version
          uv lock --help
      - name: Generate lockfile
        run: uv lock || echo "uv lock failed"
      - name: List files
        run: ls -la
      - name: Check git config and secret
        run: |
          echo "PAT_TOKEN: $PAT_TOKEN" || echo "Failed to echo PAT_TOKEN"
          git config --get user.name || echo "user.name not set"
          git config --get user.email || echo "user.email not set"
        continue-on-error: true  # Ignore les erreurs et continue
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      - name: Commit and push lockfile
        run: |
          git config user.name 'Your Name'
          git config user.email 'your.email@example.com'
          git add uv.lock
          git commit -m "Add generated uv.lock" || echo "No changes to commit"
          git push https://${{ secrets.PAT_TOKEN }}@github.com/samuelpilot86/skincheckmvp.git HEAD:main
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
